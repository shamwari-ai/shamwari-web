name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repo is a scaffold until the code is extracted into it. The code jobs
  # below are skipped (not failed) while there is nothing to build or scan.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.find.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          if [ -f package.json ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  # `npm run check` is check.mjs, not astro check. It covers dead links and
  # assets, colours with no base :root token, stray client JS, the size
  # budget, and the language-discipline rules. Keep it a required step.
  build:
    needs: detect
    if: needs.detect.outputs.code == 'true'
    uses: shamwari-ai/.github/.github/workflows/reusable-ci-astro-npm.yml@main

  secrets:
    uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main
